services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dataset_desk
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/dataset_desk
      SECRET_KEY: ${SECRET_KEY:-development-only-change-this-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ALGORITHM: ${ALGORITHM:-HS256}
      APP_NAME: ${APP_NAME:-Dataset Request Desk}
      DEBUG: ${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && PYTHONPATH=/app python seed/seed_users.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
