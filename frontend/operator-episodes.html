<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episodes — Dataset Request Desk</title>
  <link rel="stylesheet" href="/styles.css?v=3">
</head>
<body class="auth-pending">
  <nav>
    <strong data-brand>Operations</strong>
    <a data-workspace-link="requests" href="/operator.html">Requests</a>
    <a data-workspace-link="episodes" href="/operator-episodes.html" class="active">Episodes</a>
    <a data-workspace-link="analytics" href="/operator-analytics.html">Analytics</a>
    <a data-admin-link href="/admin.html" hidden>Users</a>
    <span class="spacer"></span>
    <span id="who"></span>
    <button class="secondary" onclick="API.logout()">Log out</button>
  </nav>

  <section>
    <h2>Import episodes</h2>
    <input id="csv-file" type="file" accept=".csv">
    <button id="import-btn">Import CSV</button>
    <p class="muted">Upload a CSV with columns: episode_id, robot_id, task_name, recorded_at, duration_seconds, operator_name, quality</p>
  </section>

  <section>
    <h2>Find episodes</h2>
    <input id="task-filter" placeholder="Filter task name" style="width:200px">
    <select id="quality-filter">
      <option value="">Any quality</option>
      <option value="good">good</option>
      <option value="usable">usable</option>
      <option value="bad">bad</option>
    </select>
    <label><input type="checkbox" id="available-only" checked> Available only</label>
    <button id="search-btn">Search</button>
  </section>

  <section>
    <h2>Results</h2>
    <div id="results"></div>
  </section>

  <p id="message"></p>
  <script src="/app.js?v=4"></script>
  <script>
    API.requireAuth();
    const PAGE_SIZE = 20;
    let currentOffset = 0;
    let currentParams = '';
    let tbody = null;

    function buildTable() {
      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th>Episode ID</th><th>Task</th><th>Quality</th><th>Robot</th><th>Duration</th><th>Recorded</th><th>Status</th></tr></thead>';
      tbody = document.createElement('tbody');
      table.append(tbody);
      return table;
    }

    function appendRow(ep) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(ep.episode_id)}</td>
        <td>${escapeHtml(ep.task_name)}</td>
        <td>${ep.quality}</td>
        <td>${escapeHtml(ep.robot_id)}</td>
        <td>${ep.duration_seconds}s</td>
        <td>${new Date(ep.recorded_at).toLocaleDateString()}</td>
        <td>${ep.assigned ? 'Assigned' : 'Available'}</td>`;
      tbody.append(tr);
    }

    async function searchEpisodes(reset = false) {
      if (reset) {
        currentOffset = 0;
        const container = document.querySelector('#results');
        container.replaceChildren(buildTable());
        createLoadMoreButton(container, () => searchEpisodes());
      }
      const episodes = await API.call(`/episodes?${currentParams}&limit=${PAGE_SIZE}&offset=${currentOffset}`);
      if (!episodes.length && currentOffset === 0) {
        document.querySelector('#results').innerHTML = '<p class="muted">No episodes found.</p>';
        return;
      }
      for (const ep of episodes) appendRow(ep);
      currentOffset += episodes.length;
      const loadMoreBtn = document.querySelector('#results [data-pagination]');
      if (episodes.length < PAGE_SIZE && loadMoreBtn) loadMoreBtn.remove();
      return episodes.length === PAGE_SIZE;
    }

    document.querySelector('#import-btn').onclick = async () => {
      const fileInput = document.querySelector('#csv-file');
      if (!fileInput.files.length) { showMessage('Choose a CSV file first.', 'error'); return; }
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      try {
        const result = await API.call('/episodes/import', { method: 'POST', body: formData });
        showMessage(`Imported ${result.imported}, skipped ${result.skipped}.`, 'success');
        fileInput.value = '';
        if (result.issues.length) console.table(result.issues);
      } catch (err) {
        showMessage(err.message, 'error');
      }
    };

    document.querySelector('#search-btn').onclick = () => {
      const params = new URLSearchParams();
      const task = document.querySelector('#task-filter').value.trim();
      const quality = document.querySelector('#quality-filter').value;
      const availableOnly = document.querySelector('#available-only').checked;
      if (task) params.set('task_name', task);
      if (quality) params.set('quality', quality);
      if (availableOnly) params.set('available_only', 'true');
      currentParams = params.toString();
      searchEpisodes(true).catch(showError);
    };

    API.requireWorkspaceRole().then(user => {
      if (!user) return;
      document.querySelector('#who').textContent = `${user.name} (${user.role})`;
      searchEpisodes(true).catch(showError);
    });
  </script>
</body>
</html>
