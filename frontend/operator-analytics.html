<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics — Dataset Request Desk</title>
  <link rel="stylesheet" href="/styles.css?v=3">
</head>
<body class="auth-pending">
  <nav>
    <strong data-brand>Operations</strong>
    <a data-workspace-link="requests" href="/operator.html">Requests</a>
    <a data-workspace-link="episodes" href="/operator-episodes.html">Episodes</a>
    <a data-workspace-link="analytics" href="/operator-analytics.html" class="active">Analytics</a>
    <a data-admin-link href="/admin.html" hidden>Users</a>
    <span class="spacer"></span>
    <span id="who"></span>
    <button class="secondary" onclick="API.logout()">Log out</button>
  </nav>

  <section>
    <h2>Analytics</h2>
    <label>Start date <input type="date" id="start-date" value="2026-01-01"></label>
    <label>End date <input type="date" id="end-date" value="2026-12-31"></label>
    <label>Robot <input type="text" id="robot-filter" placeholder="Filter by robot ID"></label>
    <button id="load-btn">Load</button>
  </section>

  <section id="results"></section>
  <p id="message"></p>
  <script src="/app.js?v=4"></script>
  <script>
    API.requireAuth();
    const PAGE_SIZE = 10;
    let currentPage = 1;
    let totalPages = 1;

    async function loadAnalytics(page = 1) {
      currentPage = page;
      const start = document.querySelector('#start-date').value;
      const end = document.querySelector('#end-date').value;
      const robot = document.querySelector('#robot-filter').value.trim();
      const offset = (page - 1) * PAGE_SIZE;
      let url = `/analytics?start_date=${start}&end_date=${end}&limit=${PAGE_SIZE}&offset=${offset}`;
      if (robot) url += `&robot_id=${encodeURIComponent(robot)}`;
      try {
        const data = await API.call(url);
        totalPages = Math.max(1, Math.ceil((data.total_episode_day_robot_groups ?? (data.episodes_per_day_per_robot.length + offset)) / PAGE_SIZE));
        renderResults(data);
      } catch (err) {
        showMessage(err.message, 'error');
      }
    }

    function renderResults(data) {
      const container = document.querySelector('#results');
      let html = '<h3>Episodes per day per robot</h3>';
      if (data.episodes_per_day_per_robot.length) {
        html += '<table><thead><tr><th>Date</th><th>Robot</th><th>Count</th></tr></thead><tbody>' +
          data.episodes_per_day_per_robot.map(r => `<tr><td>${r.date}</td><td>${escapeHtml(r.robot_id)}</td><td>${r.count}</td></tr>`).join('') +
          '</tbody></table>';
      } else {
        html += '<p class="muted">No episodes in range.</p>';
      }
      html += '<h3>Requests by status</h3><table><thead><tr><th>Status</th><th>Count</th></tr></thead><tbody>' +
        Object.entries(data.requests_by_status).map(([s, c]) => `<tr><td>${statusBadge(s)}</td><td>${c}</td></tr>`).join('') +
        '</tbody></table>';
      html += `<h3>Median submitted → delivered</h3><p>${data.median_submitted_to_delivered_seconds != null ? data.median_submitted_to_delivered_seconds.toFixed(1) + ' seconds' : 'No delivered requests in range.'}</p>`;
      html += '<h3>Top 5 tasks by good episodes</h3><table><thead><tr><th>Task</th><th>Good episodes</th></tr></thead><tbody>' +
        (data.top_5_good_episode_tasks.length ? data.top_5_good_episode_tasks.map(t => `<tr><td>${escapeHtml(t.task_name)}</td><td>${t.count}</td></tr>`).join('') : '<tr><td colspan="2" class="muted">None</td></tr>') +
        '</tbody></table>';

      html += '<div style="margin-top:1rem">';
      html += `<button class="secondary" onclick="loadAnalytics(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>← Prev</button>`;
      html += `<span style="margin:0 1rem">Page ${currentPage}</span>`;
      html += `<button class="secondary" onclick="loadAnalytics(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>Next →</button>`;
      html += '</div>';

      container.innerHTML = html;
    }

    document.querySelector('#load-btn').onclick = () => loadAnalytics(1);

    API.requireWorkspaceRole().then(user => {
      if (!user) return;
      document.querySelector('#who').textContent = `${user.name} (${user.role})`;
      loadAnalytics().catch(showError);
    });
  </script>
</body>
</html>
