<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operator — Dataset Request Desk</title>
  <link rel="stylesheet" href="/styles.css?v=3">
</head>
<body class="auth-pending">
  <nav>
    <strong data-brand>Operations</strong>
    <a data-workspace-link="requests" href="/operator.html" class="active">Requests</a>
    <a data-workspace-link="episodes" href="/operator-episodes.html">Episodes</a>
    <a data-workspace-link="analytics" href="/operator-analytics.html">Analytics</a>
    <a data-admin-link href="/admin.html" hidden>Users</a>
    <span class="spacer"></span>
    <span id="who"></span>
    <button class="secondary" onclick="API.logout()">Log out</button>
  </nav>

  <section>
    <h2>All requests</h2>
    <div id="requests"></div>
  </section>

  <p id="message"></p>
  <script src="/app.js?v=4"></script>
  <script>
    API.requireAuth();
    let currentUser = null;
    const PAGE_SIZE = 10;
    let currentOffset = 0;
    let tbody = null;

    function buildTable() {
      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th>ID</th><th>Task</th><th>Client</th><th>Progress</th><th>Deadline</th><th>Status</th><th>Actions</th></tr></thead>';
      tbody = document.createElement('tbody');
      table.append(tbody);
      return table;
    }

    function appendRow(req) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${req.id}</td>
        <td>${escapeHtml(req.task_name)}</td>
        <td>${escapeHtml(req.client_name || '')}</td>
        <td>${progressBar(req.assigned_count || 0, req.episodes_requested)}</td>
        <td>${req.deadline}</td>
        <td>${statusBadge(req.status)}</td>
        <td class="row-actions"></td>`;
      const actions = tr.querySelector('.row-actions');
      if (req.status === 'submitted' || req.status === 'rejected') {
        const btn = document.createElement('button');
        btn.textContent = 'Start / rework';
        btn.onclick = () => changeStatus(req.id, 'in_progress');
        actions.append(btn);
      }
      if (req.status === 'in_progress') {
        const btn = document.createElement('button');
        btn.textContent = 'Deliver';
        btn.onclick = () => changeStatus(req.id, 'delivered');
        actions.append(btn);
      }
      if (req.status === 'in_progress' || req.status === 'submitted' || req.status === 'rejected') {
        const btn = document.createElement('button');
        btn.textContent = 'Assign episode';
        btn.className = 'secondary';
        btn.onclick = () => showAssignDropdown(req.id, actions);
        actions.append(btn);
      }
      const expand = document.createElement('span');
      expand.className = 'expand-btn';
      expand.textContent = 'Details';
      expand.style.marginLeft = '0.5rem';
      expand.onclick = () => toggleDetail(req.id, tr).catch(showError);
      actions.append(expand);
      tbody.append(tr);

      const detailTr = document.createElement('tr');
      detailTr.className = 'detail-row';
      detailTr.id = `detail-${req.id}`;
      detailTr.innerHTML = `<td colspan="7"><div id="detail-content-${req.id}">Loading…</div></td>`;
      tbody.append(detailTr);
    }

    async function loadRequests(reset = false) {
      if (reset) {
        currentOffset = 0;
        const container = document.querySelector('#requests');
        container.replaceChildren(buildTable());
        createLoadMoreButton(container, () => loadRequests());
      }
      const requests = await API.call(`/requests?limit=${PAGE_SIZE}&offset=${currentOffset}`);
      if (!requests.length && currentOffset === 0) {
        document.querySelector('#requests').innerHTML = '<p class="muted">No requests.</p>';
        return;
      }
      for (const req of requests) appendRow(req);
      currentOffset += requests.length;
      const loadMoreBtn = document.querySelector('#requests [data-pagination]');
      if (requests.length < PAGE_SIZE && loadMoreBtn) loadMoreBtn.remove();
      return requests.length === PAGE_SIZE;
    }

    async function toggleDetail(id) {
      const detailRow = document.querySelector(`#detail-${id}`);
      const isOpen = detailRow.classList.toggle('open');
      if (!isOpen) return;
      const content = document.querySelector(`#detail-content-${id}`);
      const episodes = await API.call(`/episodes/requests/${id}/assignments`);
      const history = await API.call(`/requests/${id}/history`);
      content.innerHTML = `
        <h3>Assigned episodes</h3>
        ${episodes.length ? '<table><thead><tr><th>Episode ID</th><th>Task</th><th>Quality</th><th>Robot</th></tr></thead><tbody>' +
          episodes.map(ep => `<tr><td>${escapeHtml(ep.episode_id)}</td><td>${escapeHtml(ep.task_name)}</td><td>${ep.quality}</td><td>${escapeHtml(ep.robot_id)}</td></tr>`).join('') +
        '</tbody></table>' : '<p class="muted">No episodes assigned yet.</p>'}
        <h3>Status history</h3>
        <table><thead><tr><th>From</th><th>To</th><th>By</th><th>When</th><th>Note</th></tr></thead><tbody>
          ${history.map(h => `<tr><td>${h.from_status || '—'}</td><td>${h.to_status}</td><td>${h.changed_by_id}</td><td>${new Date(h.changed_at).toLocaleString()}</td><td>${escapeHtml(h.note || '')}</td></tr>`).join('')}
        </tbody></table>`;
    }

    async function changeStatus(id, status) {
      try {
        await API.call(`/requests/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) });
        showMessage(`Request moved to ${status}.`, 'success');
        await loadRequests(true);
      } catch (err) {
        showMessage(err.message, 'error');
      }
    }

    async function showAssignDropdown(requestId, actionsCell) {
      try {
        const episodes = await API.call('/episodes?available_only=true&limit=50');
        actionsCell.replaceChildren();
        const select = document.createElement('select');
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Pick episode…';
        select.append(placeholder);
        for (const ep of episodes) {
          const opt = document.createElement('option');
          opt.value = ep.id;
          opt.textContent = `${ep.episode_id} · ${ep.task_name} · ${ep.quality}`;
          select.append(opt);
        }
        const assignBtn = document.createElement('button');
        assignBtn.textContent = 'Assign';
        assignBtn.onclick = async () => {
          if (!select.value) { showMessage('Pick an episode first.', 'error'); return; }
          try {
            await API.call(`/episodes/requests/${requestId}/assignments`, { method: 'POST', body: JSON.stringify({ episode_id: Number(select.value) }) });
            showMessage('Episode assigned.', 'success');
            await loadRequests(true);
          } catch (err) {
            showMessage(err.message, 'error');
          }
        };
        actionsCell.append(select, assignBtn);
      } catch (err) {
        showMessage(err.message, 'error');
      }
    }

    API.requireWorkspaceRole().then(user => {
      if (!user) return;
      currentUser = user;
      document.querySelector('#who').textContent = `${user.name} (${user.role})`;
      loadRequests(true).catch(showError);
    });
  </script>
</body>
</html>
